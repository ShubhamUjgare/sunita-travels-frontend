<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Login | Sunita Tours & Travels</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/login.css">
   <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <div class="login-page">
    <div class="login-card">

      <h2>Welcome Back</h2>
      <p>Please login to your account</p>

      <form id="loginForm">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required id="email">

        <label>Password</label>
        <input type="password" placeholder="Enter your password" required id="password">

        <div id="loginStatus" class="status-container"></div>
        
        <div class="login-options">
          <label class="remember">
            <input type="checkbox">
            Remember me
          </label>

          <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <button type="submit">Login</button>
      </form>

      <p class="signup-text">
        Don’t have an account?
        <a href="signup.html">Create one</a>
      </p>

    </div>
  </div>
  <script src="config.js"></script>

  <script src="/frontend/js/login.js"></script>
</body>
</html>

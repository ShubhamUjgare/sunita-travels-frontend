<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="my-profile.css" />
  <link rel="stylesheet" href="responsive.css" />
</head>
<body>

<div class="dashboard">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="profile-icon">👤</div>

    <a href="my-trips.html" class="nav-link">🧳 My Trips</a>
    <a href="my-profile.html" class="nav-link active">👤 My Profile</a>
  </aside>

  <!-- Main Content -->
  <main class="content">
    <h1 id="profileName">My Profile</h1>

    <div class="profile-card">

      <!-- PROFILE VIEW -->
      <div class="profile-view">
        <div class="profile-row">
          <span class="label">Full Name</span>
          <span class="value" id="viewName">-</span>
        </div>

        <div class="profile-row">
          <span class="label">Email</span>
          <span class="value" id="viewEmail">-</span>
        </div>

        <div class="profile-row">
          <span class="label">Mobile</span>
          <span class="value" id="viewPhone">-</span>
        </div>

        <div class="profile-row">
          <span class="label">City</span>
          <span class="value" id="viewCity">-</span>
        </div>

        <button id="editBtn">Edit Profile</button>
      </div>

      <!-- PROFILE FORM (EXISTING FEATURE – HIDDEN BY DEFAULT) -->
      <form id="profileForm" class="hidden">

        <div class="field">
          <label>Full Name</label>
          <input type="text" id="name" />
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" id="email" disabled />
        </div>

        <div class="field">
          <label>Mobile Number</label>
          <input type="text" id="phone" />
        </div>

        <div class="field">
          <label>City</label>
          <input type="text" id="city" />
        </div>

        <button type="submit">Save Profile</button>
      </form>

    </div>
  </main>

</div>

<script src="config.js"></script>

<script>
const API_BASE_URL = "https://tours-and-travels-backend-ze7e.onrender.com";

const token = localStorage.getItem("token");
if (!token) location.href = "login.html";

const profileView = document.querySelector(".profile-view");
const profileForm = document.getElementById("profileForm");
const editBtn = document.getElementById("editBtn");

async function loadProfile() {
  const res = await fetch(`${API_BASE_URL}/api/auth/me`, {
    headers: { Authorization: `Bearer ${token}` }
  });

  const user = await res.json();

  // View mode
  document.getElementById("viewName").innerText = user.name || "-";
  document.getElementById("viewEmail").innerText = user.email || "-";
  document.getElementById("viewPhone").innerText = user.phone || "-";
  document.getElementById("viewCity").innerText = user.city || "-";
  document.getElementById("profileName").innerText = user.name || "My Profile";

  // Form mode (existing feature)
  document.getElementById("name").value = user.name || "";
  document.getElementById("email").value = user.email || "";
  document.getElementById("phone").value = user.phone || "";
  document.getElementById("city").value = user.city || "";
}

editBtn.addEventListener("click", () => {
  profileView.classList.add("hidden");
  profileForm.classList.remove("hidden");
});

profileForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  await fetch(`${API_BASE_URL}/api/auth/update-profile`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${token}`
    },
    body: JSON.stringify({
      name: name.value,
      phone: phone.value,
      city: city.value
    })
  });

  alert("Profile updated successfully ✅");

  profileForm.classList.add("hidden");
  profileView.classList.remove("hidden");

  loadProfile();
});

loadProfile();
</script>

</body>
</html>
